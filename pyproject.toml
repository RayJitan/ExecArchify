[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "execarchify"
version = "0.1.1"
description = "A local, Git-aware code graph and MCP server for any repository"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
watch = ["watchdog>=4"]

[project.scripts]
execarchify = "execarchify.__main__:main"

[tool.setuptools.packages.find]
include = ["execarchify*"]

[tool.setuptools.package-data]
execarchify = ["static/*"]

[tool.setuptools.data-files]
"share/execarchify/skills/execarchify" = [".agents/skills/execarchify/SKILL.md"]
"share/execarchify/skills/execarchify/references" = [".agents/skills/execarchify/references/workspace.md"]
